<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Siege 3D</title>
    <style>
      :root {
        --bg-top: #111827;
        --bg-bottom: #020617;
        --hud: #e2e8f0;
        --accent: #22d3ee;
        --danger: #fb7185;
        --success: #34d399;
        --warning: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, var(--bg-top), var(--bg-bottom));
        color: var(--hud);
      }

      #game {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      body.game-active #game {
        cursor: crosshair;
      }

      .hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .top-bar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: repeat(5, max-content);
        gap: 14px;
        max-width: calc(100vw - 24px);
        background: rgba(2, 6, 23, 0.76);
        border: 1px solid rgba(34, 211, 238, 0.35);
        border-radius: 8px;
        padding: 10px 14px;
        backdrop-filter: blur(6px);
      }

      .stat {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      .value {
        color: var(--accent);
        margin-left: 6px;
        font-weight: 700;
      }

      .value.health {
        color: var(--success);
      }

      .value.ammo {
        color: var(--warning);
      }

      .status-line {
        position: absolute;
        left: 50%;
        top: 62px;
        transform: translateX(-50%);
        max-width: min(520px, calc(100vw - 32px));
        min-height: 30px;
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(2, 6, 23, 0.52);
        color: #cbd5e1;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-align: center;
        text-transform: uppercase;
        opacity: 0.94;
        backdrop-filter: blur(6px);
      }

      .health-wrap {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        width: min(460px, 72vw);
        height: 14px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.15);
        border: 1px solid rgba(148, 163, 184, 0.35);
        overflow: hidden;
      }

      #healthBar {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, var(--danger), #f97316, #facc15);
        transform-origin: left;
        transition: transform 120ms linear;
      }

      .crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        --spread: 8px;
        width: 72px;
        height: 72px;
        transform: translate(-50%, -50%);
      }

      .crosshair span {
        position: absolute;
        border-radius: 999px;
        background: rgba(226, 232, 240, 0.92);
        box-shadow: 0 0 8px rgba(34, 211, 238, 0.35);
      }

      .crosshair .top,
      .crosshair .bottom {
        left: 50%;
        transform: translateX(-50%);
        width: 2px;
        height: 14px;
      }

      .crosshair .left,
      .crosshair .right {
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 2px;
      }

      .crosshair .top {
        bottom: calc(50% + var(--spread));
      }

      .crosshair .bottom {
        top: calc(50% + var(--spread));
      }

      .crosshair .left {
        right: calc(50% + var(--spread));
      }

      .crosshair .right {
        left: calc(50% + var(--spread));
      }

      .crosshair .dot {
        left: 50%;
        top: 50%;
        width: 3px;
        height: 3px;
        transform: translate(-50%, -50%);
        background: rgba(251, 191, 36, 0.95);
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(2, 6, 23, 0.78);
        backdrop-filter: blur(3px);
        z-index: 2;
      }

      .card {
        width: min(600px, 90vw);
        background: linear-gradient(140deg, rgba(17, 24, 39, 0.95), rgba(3, 7, 18, 0.95));
        border: 1px solid rgba(34, 211, 238, 0.4);
        border-radius: 8px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 42px);
        letter-spacing: 0.08em;
      }

      p {
        margin: 10px 0 0;
        color: #cbd5e1;
      }

      .controls {
        margin-top: 16px;
        font-size: 13px;
        color: #94a3b8;
      }

      button {
        margin-top: 18px;
        padding: 12px 22px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
        pointer-events: auto;
        color: #042f2e;
        background: linear-gradient(135deg, #67e8f9, #22d3ee);
      }

      .hidden {
        display: none;
      }

      .mobile-controls {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        display: none;
      }

      .mobile-left,
      .mobile-right {
        position: absolute;
        bottom: 18px;
        pointer-events: none;
      }

      .mobile-left {
        left: 14px;
        width: 180px;
        height: 180px;
      }

      .mobile-right {
        right: 14px;
        width: 120px;
        height: 170px;
      }

      .touch-btn {
        position: absolute;
        width: 56px;
        height: 56px;
        border-radius: 8px;
        border: 1px solid rgba(226, 232, 240, 0.35);
        background: rgba(2, 6, 23, 0.45);
        color: #e2e8f0;
        font-weight: 700;
        font-size: 18px;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
      }

      .touch-btn:active {
        background: rgba(14, 165, 233, 0.42);
      }

      .joystick {
        position: absolute;
        left: 8px;
        bottom: 0;
        width: 148px;
        height: 148px;
        border-radius: 999px;
        border: 1px solid rgba(226, 232, 240, 0.35);
        background: radial-gradient(
          circle at 35% 35%,
          rgba(34, 211, 238, 0.2),
          rgba(2, 6, 23, 0.45)
        );
        pointer-events: auto;
        touch-action: none;
        user-select: none;
      }

      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 58px;
        height: 58px;
        border-radius: 999px;
        border: 1px solid rgba(226, 232, 240, 0.45);
        background: rgba(15, 23, 42, 0.75);
        transform: translate(-50%, -50%);
      }

      #btnJump {
        right: 0;
        top: 60px;
      }

      #btnReload {
        right: 58px;
        top: 2px;
      }

      #btnFire {
        right: 0;
        top: 2px;
      }

      @media (max-width: 720px) {
        .top-bar {
          grid-template-columns: repeat(3, max-content);
          gap: 8px 12px;
          padding: 8px 10px;
        }

        .stat {
          font-size: 12px;
          letter-spacing: 0.04em;
        }

        .status-line {
          top: 82px;
          font-size: 11px;
        }
      }

      @media (pointer: coarse) {
        .mobile-controls {
          display: block;
        }

        .crosshair {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="top-bar">
        <div class="stat">Score <span id="score" class="value">0</span></div>
        <div class="stat">Round <span id="wave" class="value">1</span></div>
        <div class="stat">Hostiles <span id="enemyCount" class="value">0</span></div>
        <div class="stat">Health <span id="healthText" class="value health">100</span></div>
        <div class="stat">Ammo <span id="ammo" class="value ammo">30</span><span id="reserveAmmo" class="value">90</span></div>
      </div>
      <div class="status-line" id="statusText">Ready</div>
      <div class="crosshair" id="crosshair" aria-hidden="true">
        <span class="top"></span>
        <span class="right"></span>
        <span class="bottom"></span>
        <span class="left"></span>
        <span class="dot"></span>
      </div>
      <div class="health-wrap"><div id="healthBar"></div></div>
    </div>

    <div id="overlay" class="overlay">
      <div class="card">
        <h1>Neon Siege 3D</h1>
        <p>Clear hostile rounds in a close-quarters neon training site.</p>
        <button id="startButton">Start Mission</button>
      </div>
    </div>

    <div id="mobileControls" class="mobile-controls">
      <div class="mobile-left">
        <div id="joystickBase" class="joystick" aria-label="Movement joystick">
          <div id="joystickKnob" class="joystick-knob"></div>
        </div>
      </div>
      <div class="mobile-right">
        <button id="btnFire" class="touch-btn" aria-label="Fire">F</button>
        <button id="btnReload" class="touch-btn" aria-label="Reload">R</button>
        <button id="btnJump" class="touch-btn" aria-label="Jump">J</button>
      </div>
    </div>

    <script type="module" src="game.js"></script>
  </body>
</html>
